<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lifestream</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body class="look-ffvii">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="o" cx="35%" cy="30%"><stop offset="0" stop-color="#ffd0c8"/><stop offset=".45" stop-color="#e0503c"/><stop offset="1" stop-color="#5a0c08"/></radialGradient><radialGradient id="g" cx="35%" cy="30%"><stop offset="0" stop-color="#f4ff9c"/><stop offset=".45" stop-color="#9ee82c"/><stop offset=".8" stop-color="#4fb51a"/><stop offset="1" stop-color="#1c5a0a"/></radialGradient></defs></svg>
<div class="edge only-blades" aria-hidden="true"></div>
<div class="tab only-blades" aria-hidden="true"><div class="grip"><span>lifestream</span></div></div>
<div class="panel">
  <div class="top">
    <svg class="orb" aria-hidden="true" width="30" height="30" viewBox="0 0 30 30"><circle class="orb-red" cx="15" cy="15" r="13" fill="url(#o)" stroke="#d6d8e4" stroke-width="1.2"/></svg>
    <h1 id="title"><svg class="xorb" aria-hidden="true" width="26" height="26" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="url(#g)"/><path d="M10 8c5 3.5 5 10.5 10 14M20 8c-5 3.5-5 10.5-10 14" stroke="rgba(255,255,230,.9)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>Lifestream</h1>
    <span class="pill only-blades wait" id="pill"><span class="dot"></span><span id="pillText">Checking…</span></span>
    <button class="gear" id="settings" aria-label="Settings" title="Settings"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  </div>
  <div class="main">
    <div class="orbdeco only-blades" aria-hidden="true"></div>
    <div class="status wait" id="status" role="status" aria-live="polite">
      <span class="dot"></span>
      <div class="stl"><div class="st1"><span id="stTitle">Checking…</span> <span id="stAddr"></span></div><div id="nums"></div></div>
    </div>
    <div class="box">
      <form id="form" class="add" autocomplete="off">
        <label for="mag" class="lbl">Add a magnet</label>
        <div class="row"><input id="mag" type="text" placeholder="Paste a magnet link" spellcheck="false"><button class="btn" id="send" type="submit">Send</button></div>
        <div class="sub badtxt hidden" id="formErr"></div>
        <div class="opts"><label class="to" for="target">Send to</label><select id="target"><option value="auto">Automatic</option><option value="midgar">Midgar · TV</option><option value="turks">Turks · Movie</option><option value="lifestream">Lifestream</option></select><label class="chk"><input type="checkbox" id="paused">Add paused</label></div>
      </form>
      <div class="lbl">Recent</div>
      <ul id="recent" class="recent"></ul>
    </div>
  </div>
  <div class="foot">
    <span class="key only-blades">ENTER</span><span class="only-blades">Send</span><span class="key only-blades">ESC</span><span class="only-blades">Close</span>
    <a id="open" href="#">Open Lifestream</a>
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
