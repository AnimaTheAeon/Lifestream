[package]
name = "lifestream"
version = "0.1.9"
edition = "2021"
build = "build.rs"
description = "A torrent client with a classic JRPG menu look."
license = "MIT"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
cxx = "1.0"
rfd = { version = "0.17.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0.0"
chrono = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "native-tls", "charset", "http2", "system-proxy", "gzip"] }
rss = "2.0"
regex = "1"
if-addrs = "0.13"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
flate2 = "1"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = { version = "3", default-features = false, optional = true }
once_cell = "1.21"
sha2 = "0.11.1"
tiny_http = "0.12"
base64 = "0.22"

[features]
default = ["gui"]
# The desktop app. Build with --no-default-features for the headless
# (Synology) version, which is controlled from a web page instead.
gui = ["dep:eframe", "dep:rfd", "dep:arboard"]

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
cxx-build = "1.0"
cc = "1"
pkg-config = "0.3"
embed-resource = "3.0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[[bin]]
name = "lifestream"
path = "src/main.rs"

[dev-dependencies]
sha1_smol = "1"
