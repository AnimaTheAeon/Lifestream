<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121e78">
<title>Lifestream</title>
<link rel="icon" href="/icon.png">
<style>
@font-face { font-family: Nunito; font-weight: 400 700; src: url('/fonts/nunito-700.ttf') format('truetype'); }
@font-face { font-family: Nunito; font-weight: 800 900; src: url('/fonts/nunito-800.ttf') format('truetype'); }
:root {
  --win: linear-gradient(160deg, #2e56be 0%, #1a2c96 40%, #121e78 62%, #06083a 100%);
  --light: #d6d8e4; --mid: #8c90a8; --dark: #2c2e46;
  --text: #f4f4f8; --dim: #aab2d6; --label: #70ccff;
  --good: #78e68c; --warn: #ffe260; --bad: #ff6e6e; --well: #080c34;
  --shadow: 2px 2px 0 rgba(0, 0, 0, .85);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: #04040c; color: var(--text); font: 700 15px/1.4 Nunito, system-ui, sans-serif; text-shadow: var(--shadow); }
button, input, select { font: inherit; }
.app { display: flex; flex-direction: column; gap: 12px; height: 100%; padding: 12px; }
.main { display: flex; gap: 12px; flex: 1; min-height: 0; }
.win { background: var(--win); border: 2px solid var(--light); border-radius: 8px; box-shadow: 0 0 0 1px var(--dark), inset 0 0 0 1px var(--mid), 0 6px 14px rgba(0,0,0,.6); }
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
#page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.content .scroll { flex: 1; min-height: 0; overflow: auto; padding: 16px 24px 28px; }
.side { width: 240px; flex: none; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
nav.win { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
.mi { position: relative; display: flex; align-items: center; min-height: 40px; padding: 0 10px 0 44px; border: 0; border-radius: 4px; background: none; color: var(--text); font-weight: 800; font-size: 20px; text-shadow: var(--shadow); text-align: left; cursor: pointer; }
.mi:hover, .mi:focus-visible { background: rgba(255,255,255,.08); outline: none; }
.mi[aria-current="page"] { background: rgba(112,204,255,.14); }
.hand { position: absolute; left: 8px; top: 50%; margin-top: -10px; width: 30px; height: 20px; display: none; }
.mi[aria-current="page"] .hand { display: block; }
.info { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lbl { color: var(--label); font-weight: 800; font-size: 13px; letter-spacing: .06em; }
.val { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .dimc { color: var(--dim); }
.status { min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 16px; white-space: nowrap; overflow: hidden; }
.status > span { overflow: hidden; text-overflow: ellipsis; }
.badge { flex: none; }
h1 { margin: 0 0 12px; font-size: 28px; font-weight: 800; }
h2 { margin: 22px 0 8px; font-size: 18px; color: var(--label); letter-spacing: .04em; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 20px; border-bottom: 1px solid rgba(214,216,228,.3); }
.btn { min-height: 36px; padding: 0 14px; border: 1px solid var(--mid); border-radius: 4px; background: #101a5c; color: var(--text); font-weight: 800; text-shadow: 1px 1px 0 #000; cursor: pointer; }
.btn:hover, .btn:focus-visible { background: #2c48aa; border-color: var(--light); outline: none; }
.btn.primary { background: #3c64c8; border-color: var(--light); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 36px; padding: 0; }
input[type=text], input[type=password], input[type=number], select { min-height: 36px; padding: 0 10px; border: 1px solid #5a64a0; border-radius: 4px; background: var(--well); color: var(--text); text-shadow: none; }
input:focus, select:focus { outline: none; border-color: var(--light); box-shadow: 0 0 0 2px rgba(112,204,255,.4); }
.t { display: grid; grid-template-columns: 48px minmax(0,1fr) 220px 120px auto; gap: 14px; align-items: center; padding: 10px; border-radius: 6px; }
.t:hover { background: rgba(255,255,255,.05); }
.sq { width: 48px; height: 48px; border: 2px solid var(--light); border-radius: 4px; background: var(--well); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
.name { font-size: 18px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { font-size: 13px; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; }
.bar { height: 8px; border-radius: 4px; background: var(--well); border: 1px solid var(--dark); overflow: hidden; }
.fill { height: 100%; }
.f-dl { background: linear-gradient(90deg, #1e6ee6, #8ce6ff); }
.f-done { background: linear-gradient(90deg, #1e9a46, #a0f0b0); }
.f-wait { background: linear-gradient(90deg, #c89614, #ffec8c); }
.f-off { background: #5a5e78; }
.tag { display: inline-block; padding: 3px 8px; border: 1px solid currentColor; border-radius: 3px; font-size: 12px; letter-spacing: .06em; text-align: center; min-width: 110px; }
.acts { display: flex; gap: 6px; }
.field input[type=checkbox] { justify-self: start; width: 20px; height: 20px; accent-color: #70ccff; }
.field { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 12px; align-items: center; margin: 8px 0; }
.field .help { grid-column: 2; font-size: 13px; color: var(--dim); text-shadow: none; margin-top: -4px; }
.cat { display: flex; gap: 8px; margin: 6px 0; }
.empty { padding: 40px 10px; text-align: center; color: var(--dim); }
.notice { margin: 0 0 12px; padding: 10px 14px; border: 1px solid var(--warn); border-radius: 6px; background: rgba(255,226,96,.08); }
.notice.bad { border-color: var(--bad); background: rgba(255,110,110,.08); color: var(--text); }
.drop { margin-top: 8px; padding: 20px; border: 2px dashed var(--mid); border-radius: 6px; text-align: center; color: var(--dim); }
.drop.over { border-color: var(--light); background: rgba(255,255,255,.05); }
.log { font: 13px/1.5 ui-monospace, Consolas, monospace; text-shadow: none; white-space: pre-wrap; }
.setup { max-width: 380px; margin: 10vh auto; padding: 24px 26px; }
.segs { display: inline-flex; border: 1px solid var(--line, #d6d8e4); border-radius: 6px; overflow: hidden; }
.seg { border: 0; background: none; color: var(--dim); font: inherit; font-weight: 800; padding: 6px 14px; cursor: pointer; }
.seg[aria-pressed="true"] { background: rgba(255,255,255,.14); color: var(--text); }
.scroll.simple .adv { display: none; }
.logbox { max-height: 320px; overflow: auto; padding: 8px; border-radius: 6px; background: rgba(0,0,0,.25); font-size: 13px; }
.toast.bad { color: #ffb4b4; }
.saved-note { color: var(--dim); font-size: 13px; white-space: nowrap; }
.saved-note.pending { color: var(--warn); }
.btn.saved, .btn.saved:hover { background: linear-gradient(#5ccf6a, #2e8a3a); border-color: #9cf0a6; color: #fff; }
body.green .btn.saved, body.green .btn.saved:hover { background: linear-gradient(#b4ff8a, #5cc81c); border-color: #e6ffb4; color: var(--on-accent); }
@media (max-width: 820px) { .saved-note { display: none; } }
.toast { position: fixed; right: 20px; bottom: 76px; padding: 10px 16px; display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* =====================================================================
   Box of X: the green console-dashboard theme (project doc
   claude/themes/green-dashboard.md). Everything hangs off body.green.
   ===================================================================== */
@font-face { font-family: Orbitron; font-weight: 800; src: url('/fonts/orbitron-800.ttf') format('truetype'); }
#gbg, #ghome, #gbar, #gfoot, .gonly { display: none; }
html:has(body.green) { background: #020c02; }
body.green {
  --text: #e4ffc4; --dim: #a6dc80; --label: #c8ff4a; --good: #8cff6e; --warn: #ffe14a; --bad: #ff7a5a; --well: #021002;
  --light: #a0ff50; --mid: #50a028; --dark: #082206; --accent: #dcff64; --on-accent: #1c3504;
  --shadow: 0 1.5px 0 rgba(0, 0, 0, .6); --cut: 22px;
  background: transparent;
}
body.green #gbg { display: block; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
body.green .gonly { display: inline-flex; align-items: center; }
body.green .side, body.green footer.status { display: none; }
body.green #gbar { display: flex; gap: 20px; align-items: center; flex: none; }
body.green #gfoot { display: flex; gap: 14px; align-items: center; flex: none; min-height: 46px; }
body.green.ghome-on #app { display: none; }
body.green.ghome-on #ghome { display: block; }
body.green h2, body.green .toolbar h1, body.green .gtitle, body.green .seg { font-family: Orbitron, Nunito, sans-serif; text-transform: uppercase; }
body.green h2 { font-size: 15px; letter-spacing: .04em; color: var(--accent); }
/* The title bar already names the page. */
body.green .toolbar h1, body.green .scroll > h1 { visibility: hidden; font-size: 1px; }
body.green .scroll > h1 { display: none; }
body.green .lbl { color: var(--label); }

/* Panels: corner-cut glass with a lime outline and a soft glow. */
body.green .win { position: relative; background: none; border: 0; border-radius: 0; box-shadow: none; isolation: isolate; filter: drop-shadow(0 0 5px rgba(150, 255, 60, .18)); }
body.green .win::before, body.green .win::after { content: ""; position: absolute; pointer-events: none; }
body.green .win::before { inset: 0; z-index: -2; background: rgba(160, 255, 80, .75); clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
body.green .win::after { inset: 2px; z-index: -1; background: linear-gradient(160deg, rgba(26, 86, 12, .94) 0%, rgba(14, 60, 8, .94) 40%, rgba(10, 48, 6, .95) 70%, rgba(3, 22, 3, .97) 100%); clip-path: polygon(calc(var(--cut) - 1px) 0, 100% 0, 100% calc(100% - var(--cut) + 1px), calc(100% - var(--cut) + 1px) 100%, 0 100%, 0 calc(var(--cut) - 1px)); }
body.green .toast { --cut: 12px; }
body.green .toast.bad::before { background: var(--bad); }
body.green .toolbar { border-bottom-color: rgba(150, 255, 70, .2); padding-left: 30px; }
body.green .content .scroll { padding-left: 30px; }

/* Controls: square corners, green fills. */
body.green .btn, body.green input[type=text], body.green input[type=password], body.green input[type=number], body.green select, body.green .segs, body.green .tag, body.green .sq, body.green .bar, body.green .logbox, body.green .drop { border-radius: 1px; }
body.green .btn { background: #103c08; border-color: var(--mid); text-shadow: none; }
body.green .btn:hover, body.green .btn:focus-visible { background: #286e10; border-color: var(--light); }
body.green .btn:active:not(:disabled) { background: #96dc28; color: var(--on-accent); }
body.green .btn.primary { background: linear-gradient(#e2ff6a, #8cc81c); border-color: #f2ff9a; color: var(--on-accent); }
body.green .btn.primary:hover { background: linear-gradient(#f0ff9a, #a6e030); }
body.green input[type=text], body.green input[type=password], body.green input[type=number], body.green select { border-color: var(--mid); }
body.green input:focus, body.green select:focus { border-color: var(--light); box-shadow: 0 0 0 2px rgba(170, 255, 60, .35); }
body.green .field input[type=checkbox] { accent-color: #96dc28; }
body.green .segs { border-color: var(--mid); }
body.green .seg { font-size: 12px; padding: 7px 14px; }
body.green .seg[aria-pressed="true"] { background: linear-gradient(#e2ff6a, #8cc81c); color: var(--on-accent); }
body.green .t:hover { background: rgba(40, 110, 16, .35); }
body.green .sq { border-color: var(--mid); background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.18), rgba(255,255,255,0) 40%), #062a04; }
body.green .bar { background: #000e00; border-color: #0c3406; }
body.green .f-dl { background: linear-gradient(90deg, #4fb51a, #e2ff6a); }
body.green .f-done { background: linear-gradient(90deg, #2c8a12, #8cff6e); }
body.green .f-off { background: #4a5a42; }
body.green .logbox { background: rgba(0, 10, 0, .55); }
body.green .content .scroll::-webkit-scrollbar-thumb, body.green .logbox::-webkit-scrollbar-thumb { background: rgba(160, 255, 80, .45); }
body.green .toast { position: fixed; right: 30px; bottom: 80px; max-width: min(560px, calc(100vw - 60px)); }

/* Page chrome: title bar, status box, page tabs, BACK hint. */
.gtitle { flex: none; width: min(42%, 520px); min-width: 240px; height: 56px; display: flex; align-items: center; padding: 0 40px 0 34px; background: var(--accent); color: var(--on-accent); text-shadow: none; clip-path: polygon(22px 0, 100% 0, calc(100% - 22px) 100%, 0 100%); font: 800 26px Orbitron, sans-serif; white-space: nowrap; overflow: hidden; }
.gstatus { margin-left: auto; width: min(560px, 52%); height: 52px; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: rgba(0, 10, 0, .8); border: 1px solid rgba(170, 255, 90, .55); text-shadow: none; cursor: pointer; color: var(--text); font: inherit; text-align: left; }
.gstatus:hover { border-color: rgba(200, 255, 120, .9); }
.gstatus .lines { min-width: 0; flex: 1; }
.gstatus .l1, .gstatus .l2 { font-family: Orbitron, sans-serif; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gstatus .l1 { font-size: 10.5px; color: #a8e070; }
.gstatus .l2 { font-size: 12.5px; color: #f0ffd8; margin-top: 3px; }
.gstatus .l2.warn { color: var(--warn); } .gstatus .l2.bad { color: var(--bad); }
.gchip { flex: none; padding: 4px 8px; background: var(--accent); color: var(--on-accent); font: 800 10.5px Orbitron, sans-serif; text-decoration: none; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
.orb { width: 24px; height: 24px; border-radius: 50%; flex: none; background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.85) 0, rgba(255,255,255,0) 30%), radial-gradient(circle, #f4ff9c 0%, #9ee82c 35%, #4fb51a 72%, #1c5a0a 100%); box-shadow: 0 0 10px rgba(170, 255, 60, .6); }
.orb.warn { background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.8) 0, rgba(255,255,255,0) 30%), radial-gradient(circle, #fff3a0, #e8c22c 40%, #a07a10 80%, #4a3606); box-shadow: 0 0 10px rgba(255, 220, 60, .6); }
.orb.bad { background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.8) 0, rgba(255,255,255,0) 30%), radial-gradient(circle, #ffc0a8, #ff7a5a 40%, #b03a20 80%, #4a1006); box-shadow: 0 0 10px rgba(255, 110, 70, .6); }
#gtabs { display: flex; gap: 8px; flex: 1; min-width: 0; flex-wrap: wrap; }
.gnav { position: relative; isolation: isolate; border: 0; padding: 7px 16px; min-width: 110px; font: 800 12px Orbitron, sans-serif; text-transform: uppercase; color: #bef27e; background: rgba(150, 240, 70, .5); cursor: pointer; clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); }
.gnav::before { content: ""; position: absolute; inset: 1px; z-index: -1; background: linear-gradient(#24700e, #0c3406); clip-path: polygon(8.5px 0, 100% 0, 100% calc(100% - 8.5px), calc(100% - 8.5px) 100%, 0 100%, 0 8.5px); }
.gnav:hover, .gnav:focus-visible { color: #e6ffb4; background: rgba(170, 255, 90, .85); outline: none; }
.gnav[aria-current="page"] { color: var(--on-accent); background: #f2ff9a; }
.gnav[aria-current="page"]::before { background: linear-gradient(#e2ff6a, #8cc81c); }
.ghint { display: inline-flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; font: 800 17px Orbitron, sans-serif; color: #bef27e; text-transform: uppercase; text-shadow: none; cursor: pointer; }
.ghint .node { width: 46px; height: 46px; font-size: 9.5px; color: #d8ff9a; }
.ghint:hover, .ghint:focus-visible { color: #e6ffb4; outline: none; }
.ghint:hover .node, .ghint:focus-visible .node { --lit: 1; }
.node { position: relative; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: Orbitron, sans-serif; background: radial-gradient(circle, #041403 0%, #0a2806 48%, #2c8a12 76%, #8de83a 86%, #1c5a0a 100%); box-shadow: 0 0 calc(8px + 10px * var(--lit, 0)) rgba(150, 255, 60, calc(.35 + .4 * var(--lit, 0))); transition: box-shadow .4s ease; }
.node::after { content: ""; position: absolute; inset: 32%; border-radius: 50%; border: 1.5px solid rgba(160, 255, 80, .4); }
.node.lit { --lit: 1; background: radial-gradient(circle, #041403 0%, #0a2806 48%, #2c8a12 76%, #dcff6e 86%, #1c5a0a 100%); }

/* Home screen: the big orb with the menu on an arc around it. */
#ghome { position: fixed; inset: 0; overflow: hidden; }
.bigorb { position: absolute; transform: translate(-50%, -50%); }
.bigorb .shell { position: absolute; inset: -11%; border-radius: 50%; border: 2px solid rgba(120, 220, 50, .35); }
.bigorb .spin { position: absolute; inset: -6%; border-radius: 50%; border: calc(var(--r) * .07) solid transparent; border-top-color: rgba(140, 240, 60, .3); border-right-color: rgba(140, 240, 60, .18); animation: orbspin 18s linear infinite; }
.bigorb .jelly { position: absolute; inset: -2%; border-radius: 50%; background: rgba(60, 170, 24, .28); border: 3px solid rgba(160, 255, 80, .43); animation: jelly 9s ease-in-out infinite alternate; }
.bigorb .core { position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.75) 0, rgba(255,255,255,0) 22%), radial-gradient(circle, #f4ff9c 0%, #9ee82c 35%, #4fb51a 72%, #1c5a0a 100%); animation: breathe 9s ease-in-out infinite alternate; }
.bigorb .lobe { position: absolute; border-radius: 50%; background: rgba(140, 240, 60, .18); border: 1.5px solid rgba(200, 255, 120, .27); animation: drift 7s ease-in-out infinite alternate; }
.bigorb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
@keyframes orbspin { to { transform: rotate(360deg); } }
@keyframes jelly { 0% { transform: translate(-1%, 1%) scale(1.03, .97); } 100% { transform: translate(1.5%, -1%) scale(.98, 1.02); } }
@keyframes drift { to { transform: translate(6%, -5%); } }
@keyframes breathe { 0% { box-shadow: 0 0 calc(var(--r) * .36) rgba(170, 255, 60, .42); } 100% { box-shadow: 0 0 calc(var(--r) * .46) rgba(170, 255, 60, .52); } }
body.calm .bigorb * { animation: none !important; }
.gmenu-item { position: absolute; display: flex; align-items: center; cursor: pointer; }
.gmenu-item .wire { width: 26px; height: 2px; background: rgba(150, 255, 70, .55); flex: none; }
.gmenu-item.lit .wire { background: rgba(150, 255, 70, .9); }
.gtab { flex: none; height: 100%; display: flex; align-items: center; padding-left: 26px; font: 800 22px Orbitron, sans-serif; text-transform: uppercase; color: #bef27e; text-shadow: 0 1.5px 0 rgba(0, 0, 0, .6); position: relative; isolation: isolate; background: rgba(150, 240, 70, .6); clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); }
.gtab::before { content: ""; position: absolute; inset: 2px; z-index: -1; background: linear-gradient(#24700e, #0c3406); clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }
.gmenu-item.lit .gtab { background: #f2ff9a; color: #1c3504; text-shadow: none; }
.gmenu-item.lit .gtab::before { background: linear-gradient(#e2ff6a, #8cc81c); }
#ghome .gstatus { position: absolute; left: 22px; bottom: 22px; width: min(600px, 46vw); }
#ghome .ghint { position: absolute; bottom: 26px; }
/* The soft dark veil the orb zoom eases into (no bright flash). */
#gveil { position: fixed; inset: 0; background: rgb(3, 18, 3); opacity: 0; pointer-events: none; z-index: 50; }
@media (max-width: 820px) {
  .gtitle { width: auto; min-width: 0; flex: 1; font-size: 18px; height: 44px; padding: 0 30px 0 24px; }
  #gbar .gstatus { width: 52px; flex: none; height: 44px; }
  #gbar .gstatus .lines, #gbar .gstatus .gchip { display: none; }
  #ghome .gstatus { width: auto; right: 22px; bottom: 90px; }
  #gtabs { flex-wrap: nowrap; gap: 5px; }
  .gnav { min-width: 0; padding: 7px 9px; font-size: 10.5px; }
  .ghint { font-size: 14px; }
}
@media (max-width: 820px) {
  .main { flex-direction: column-reverse; }
  .side { width: auto; }
  nav.win { flex-direction: row; flex-wrap: wrap; }
  .mi { font-size: 16px; padding-left: 10px; min-height: 44px; }
  .mi .hand { display: none !important; }
  .info { display: none; }
  .t { grid-template-columns: 40px minmax(0,1fr); }
  .t > .gauge, .t > .tagcell { grid-column: 2; }
  .t > .acts { grid-column: 2; }
  .field { grid-template-columns: 1fr; }
  .field .help { grid-column: 1; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="glove" viewBox="0 0 30 20"><rect x="2" y="8" width="22" height="11" rx="4" fill="#000" fill-opacity=".35"/><rect x="1" y="5" width="6" height="11" rx="2" fill="#c4c8d6" stroke="#1e1e28" stroke-width="1.2"/><rect x="6" y="4" width="12" height="13" rx="4" fill="#fafafc" stroke="#1e1e28" stroke-width="1.2"/><rect x="14" y="4" width="15" height="5" rx="2.5" fill="#fafafc" stroke="#1e1e28" stroke-width="1.2"/><path d="M9 10h7M9 13h7" stroke="#c4c8d6"/></symbol>
</svg>


<!-- Box of X: background grid and the home screen. -->
<svg id="gbg" preserveAspectRatio="none" aria-hidden="true"></svg>
<div id="ghome">
  <div class="bigorb" id="bigorb" aria-hidden="true"></div>
  <nav id="gmenu" aria-label="Menu"></nav>
  <button class="gstatus" id="ghome-status" title="Open Settings"></button>
  <button class="ghint" id="gmode" title="Simple shows the settings most people need. Advanced shows everything, plus the tools and the log."><span class="node">MODE</span><span id="gmode-label">SIMPLE</span></button>
  <button class="ghint" id="genter" style="right:50px"><span class="node">ENTER</span>SELECT</button>
</div>
<div id="gveil"></div>

<div id="setup" class="win setup" hidden>
  <h1>Lifestream</h1>
  <p>Choose a username and password. You'll use them to open this page, and in Midgar, Turks or Sonarr when you add Lifestream as a Transmission download client.</p>
  <form id="setup-form">
    <div class="field" style="grid-template-columns:1fr"><label class="lbl" for="su">USERNAME</label><input id="su" type="text" autocomplete="username" required></div>
    <div class="field" style="grid-template-columns:1fr"><label class="lbl" for="sp">PASSWORD (6+ CHARACTERS)</label><input id="sp" type="password" autocomplete="new-password" minlength="6" required></div>
    <button class="btn primary" type="submit" style="width:100%;margin-top:10px">Save</button>
    <p id="setup-error" class="bad" role="alert"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <div id="gbar"><div class="gtitle" id="gtitle"></div><button class="gstatus" id="gstatus" title="Open Settings"></button></div>
  <div class="main">
    <section class="win content" aria-live="polite">
      <div id="page"></div>
    </section>
    <aside class="side">
      <nav class="win" aria-label="Menu">
        <button class="mi" data-page="torrents"><svg class="hand"><use href="#glove"/></svg>Torrents</button>
        <button class="mi" data-page="add"><svg class="hand"><use href="#glove"/></svg>Add</button>
        <button class="mi" data-page="settings"><svg class="hand"><use href="#glove"/></svg>Settings</button>
      </nav>
      <section class="win info" aria-label="Status">
        <div class="row" style="justify-content:flex-start;gap:8px"><span id="badge"></span><span id="headline" class="val" style="font-size:14px"></span></div>
        <div class="row"><span class="lbl">Time</span><span id="i-time" class="val"></span></div>
        <div class="row"><span class="lbl">Down</span><span id="i-dl" class="val"></span></div>
        <div class="row"><span class="lbl">Up</span><span id="i-ul" class="val"></span></div>
        <div class="row"><span class="lbl">Torrents</span><span id="i-count" class="val"></span></div>
        <button id="pause-all" class="btn" style="margin-top:4px;color:var(--label)"></button>
      </section>
    </aside>
  </div>
  <div id="gfoot"><nav id="gtabs" aria-label="Pages"></nav><button class="ghint" id="gback"><span class="node">ESC</span>BACK</button></div>
  <footer class="win status"><span id="s-badge" class="badge"></span><span id="s-text"></span><a id="s-update" class="tag warn" style="margin-left:auto;min-width:0;text-decoration:none" target="_blank" rel="noreferrer" hidden></a></footer>
</div>
<div id="toast" class="win toast" role="status"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const bytes = (n) => { if (!n || n < 0) return '0 B'; const u = ['B','KB','MB','GB','TB']; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + ' ' + u[i]; };
const rate = (n) => bytes(n) + '/s';
const eta = (s) => { if (s < 0) return '—'; const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return h ? `${h}h ${m}m` : `${m}m ${s % 60}s`; };
const clock = (s) => [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((n) => String(n).padStart(2, '0')).join(':');
function badge(kind) {
  const fill = { good: '#1e9a46', warn: '#c89614', bad: '#b43c3c' }[kind];
  const mark = { good: '<path d="M5.5 10.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>', warn: '<path d="M10 5v6M10 14v.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>', bad: '<path d="M6.5 6.5l7 7M13.5 6.5l-7 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>' }[kind];
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 20 20'); s.setAttribute('width', 20); s.setAttribute('height', 20); s.setAttribute('aria-hidden', 'true');
  s.innerHTML = `<circle cx="10" cy="10" r="9" fill="${fill}" stroke="#d6d8e4" stroke-width="1.5"/>${mark}`;
  return s;
}
function toast(text, bad) { const t = $('#toast'); t.textContent = text; t.classList.toggle('bad', !!bad); t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', bad ? 8000 : 3500); }
// Run an action; say so when it works, and always say why when it doesn't.
// The UPDATE link in the status bar (FFVII menu) or status box (Box of X).
function fillUpdateLink(link, long) {
  const u = (state && state.update) || {};
  if (u.busy) {
    link.hidden = false; link.textContent = u.busy.toUpperCase(); link.removeAttribute('href'); link.onclick = (e) => e.stopPropagation(); link.title = 'Lifestream is updating itself. This page reloads when it is back.';
  } else if (u.version) {
    link.hidden = false;
    if (u.canInstall) {
      link.textContent = long ? `UPDATE TO ${u.version}` : `UPDATE ${u.version}`;
      link.href = '#'; link.removeAttribute('target');
      link.title = 'Install it now. Downloads pause for a few seconds while Lifestream restarts.';
      link.onclick = (e) => { e.preventDefault(); e.stopPropagation(); installUpdate(u.version); };
    } else {
      link.textContent = long ? `UPDATE ${u.version} READY` : `UPDATE ${u.version}`;
      link.href = (state.headless ? u.spk : u.installer) || u.page; link.target = '_blank'; link.onclick = (e) => e.stopPropagation();
      link.title = state.headless ? 'Download the new package, then in Package Center choose Manual Install. Your torrents and settings are kept.' : 'Lifestream offers this update in its own window too.';
    }
  } else link.hidden = true;
}
function installUpdate(v) {
  if (!confirm(`Update Lifestream to ${v} now?\n\nDownloads pause for a few seconds while it restarts. Your torrents and settings are kept.`)) return;
  doAction('update-install', 'Downloading the update. This page reloads when Lifestream is back.');
}
const doAction = (action, done) => api('action', 'POST', { action }).then(() => done && toast(done)).catch((e) => toast(e.message, true));

// ---- Transmission RPC (same API Midgar uses)
let sessionId = '';
async function rpc(method, args = {}) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const r = await fetch('/transmission/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Transmission-Session-Id': sessionId, 'X-Lifestream': '1' }, body: JSON.stringify({ method, arguments: args }) });
    if (r.status === 409) { sessionId = r.headers.get('X-Transmission-Session-Id') || ''; continue; }
    if (r.status === 401) throw new Error('Not signed in. Reload the page and sign in again.');
    if (!r.ok) throw new Error('Lifestream answered with error ' + r.status);
    const j = await r.json();
    if (j.result !== 'success') throw new Error(j.result);
    return j.arguments;
  }
  throw new Error('No session');
}
async function api(path, method = 'GET', body) {
  const headers = { 'X-Lifestream': '1' };
  if (body) headers['Content-Type'] = 'application/json';
  let r;
  try { r = await fetch('/lifestream/api/' + path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error("Can't reach Lifestream"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || (r.status === 401 ? 'Not signed in. Reload the page and sign in again.' : r.status === 403 ? 'Lifestream refused this request (403).' : 'Error ' + r.status));
  return j;
}

// ---- state
let state = null, torrents = [], page = location.hash.slice(1) || 'torrents';
const FIELDS = ['id','hashString','name','status','percentDone','totalSize','leftUntilDone','rateDownload','rateUpload','eta','uploadRatio','labels','errorString','downloadDir','peersConnected','isPrivate'];

async function refresh() {
  try {
    state = await api('state');
    if (refresh.version && state.version && state.version !== refresh.version) { location.reload(); return; }
    refresh.version = state.version || refresh.version;
    if (state.setup) { $('#setup').hidden = false; $('#app').hidden = true; return; }
    $('#setup').hidden = true; $('#app').hidden = false;
    applyTheme();
    torrents = (await rpc('torrent-get', { fields: FIELDS })).torrents;
    drawInfo();
    if (page === 'torrents') drawTorrents();
  } catch (e) {
    $('#s-text').textContent = 'Lost contact with Lifestream (' + e.message + ')';
  }
}

function overall() {
  if (!state) return ['bad', 'CONNECTING', ''];
  if (state.engineError) return ['bad', 'ENGINE ERROR', state.engineError];
  if (state.killHold) return ['bad', 'KILL SWITCH ON', (state.killReason || '').replace('on the Network page', 'in Settings')];
  if (state.listenError) return ['warn', 'PORT PROBLEM', state.listenError];
  if (state.userPaused) return ['warn', 'ALL PAUSED', 'Everything is paused. Press Resume all to continue.'];
  return ['good', state.adapter ? 'VPN PROTECTED' : 'RUNNING', state.adapterIp ? `Bound to ${state.adapter} (${state.adapterIp})` : 'Downloads are running.'];
}
function drawInfo() {
  const [kind, title, detail] = overall();
  $('#badge').replaceChildren(badge(kind));
  $('#headline').textContent = title; $('#headline').className = 'val ' + kind;
  $('#i-time').textContent = clock(state.uptimeSecs);
  $('#i-dl').textContent = rate(state.dlRate);
  $('#i-ul').textContent = rate(state.ulRate);
  $('#i-count').textContent = state.torrentCount;
  $('#pause-all').textContent = state.userPaused ? 'RESUME ALL' : 'PAUSE ALL';
  $('#s-badge').replaceChildren(badge(kind));
  const bits = [detail, `↓ ${rate(state.dlRate)}  ↑ ${rate(state.ulRate)}`];
  if (state.listenPort) bits.push(`Port ${state.externalPort || state.listenPort}${state.incomingSeen ? ' (open)' : ''}`);
  $('#s-text').textContent = bits.filter(Boolean).join(' · ');
  $('#s-text').className = kind === 'good' ? '' : kind;
  fillUpdateLink($('#s-update'), true);
  if ($('#t-pause')) $('#t-pause').textContent = state.userPaused ? 'Resume all' : 'Pause all';
  drawGreenStatus(kind, title, detail);
  if (page === 'settings' && drawSettings.drawUpdates) drawSettings.drawUpdates();
  if (state.toast && state.toast !== drawInfo.lastToast) { drawInfo.lastToast = state.toast; toast(state.toast); }
}

const STATUS = { 0: ['PAUSED', 'dimc', 'f-off'], 1: ['CHECK WAIT', 'warn', 'f-wait'], 2: ['CHECKING', 'warn', 'f-wait'], 3: ['QUEUED', 'dimc', 'f-wait'], 4: ['DOWNLOADING', '', 'f-dl'], 5: ['QUEUED', 'dimc', 'f-done'], 6: ['SEEDING', 'good', 'f-done'] };

function torrentRow(t) {
  let [word, cls, fill] = STATUS[t.status] || ['?', '', 'f-off'];
  const pct = Math.round((t.percentDone || 0) * 1000) / 10;
  const noInfo = !t.totalSize;
  const done = !noInfo && t.leftUntilDone === 0;
  if (noInfo && t.status !== 0) [word, cls] = ['GETTING INFO', 'warn'];
  // The kill switch or Pause all holds everything at the session level.
  if (state && (state.killHold || state.userPaused) && t.status !== 0) [word, cls, fill] = ['HELD', 'warn', 'f-wait'];
  const paused = t.status === 0;
  const act = (method) => async () => { try { await rpc(method, { ids: [t.hashString] }); refresh(); } catch (e) { toast(e.message, true); } };
  return el('div', { class: 't' },
    el('div', { class: 'sq', title: t.isPrivate ? 'Private tracker' : '' }, pct >= 100 ? '✓' : Math.floor(pct) + '%'),
    el('div', { style: 'min-width:0' },
      el('div', { class: 'name', title: t.name }, t.name || t.hashString),
      el('div', { class: 'sub' },
        el('span', {}, el('span', { class: 'lbl' }, 'SIZE '), bytes(t.totalSize)),
        el('span', {}, el('span', { class: 'lbl' }, 'RATIO '), (t.uploadRatio || 0).toFixed(2)),
        t.labels && t.labels.length ? el('span', {}, el('span', { class: 'lbl' }, 'CAT '), t.labels[0]) : null,
        el('span', {}, el('span', { class: 'lbl' }, 'PEERS '), t.peersConnected),
        t.errorString ? el('span', { class: 'bad' }, t.errorString) : null)),
    el('div', { class: 'gauge' },
      el('div', { class: 'row' }, el('span', { class: 'lbl' }, done ? 'DONE' : 'ETA ' + eta(t.eta)), el('span', { class: 'val', style: 'font-size:14px' }, `↓ ${rate(t.rateDownload)}  ↑ ${rate(t.rateUpload)}`)),
      el('div', { class: 'bar', role: 'progressbar', 'aria-valuenow': pct, 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-label': (t.name || '') + ' progress' }, el('div', { class: 'fill ' + fill, style: `width:${pct}%` }))),
    el('div', { class: 'tagcell' }, el('span', { class: 'tag ' + cls }, word)),
    el('div', { class: 'acts' },
      el('button', { class: 'btn icon-btn', title: paused ? 'Resume' : 'Pause', 'aria-label': (paused ? 'Resume ' : 'Pause ') + t.name, onclick: act(paused ? 'torrent-start' : 'torrent-stop') }, paused ? '▶' : '❚❚'),
      el('button', { class: 'btn icon-btn danger', title: 'Remove', 'aria-label': 'Remove ' + t.name, onclick: () => removeDialog(t) }, '✕')));
}

async function removeDialog(t) {
  if (!confirm(`Remove "${t.name}" from Lifestream?`)) return;
  const del = confirm('Also delete its downloaded files?\n\nOK = delete files, Cancel = keep files');
  try { await rpc('torrent-remove', { ids: [t.hashString], 'delete-local-data': del }); toast('Removed'); refresh(); } catch (e) { toast(e.message, true); }
}

let filter = '';
function drawTorrents() {
  const root = $('#page');
  let list = root.querySelector('#tlist');
  if (!list) {
    root.replaceChildren(
      el('div', { class: 'toolbar' },
        el('h1', { style: 'margin:0;flex:1' }, 'Torrents'),
        el('label', { class: 'sr', for: 'flt' }, 'Filter torrents'),
        el('input', { id: 'flt', type: 'text', placeholder: 'Filter…', value: filter, oninput: (e) => { filter = e.target.value.toLowerCase(); drawTorrents(); } }),
        el('button', { class: 'btn gonly', id: 't-pause', onclick: togglePauseAll }, state && state.userPaused ? 'Resume all' : 'Pause all'),
        el('button', { class: 'btn', onclick: () => go('add') }, 'Add torrent')),
      el('div', { class: 'scroll', id: 'tlist' }));
    list = root.querySelector('#tlist');
  }
  const shown = torrents.filter((t) => !filter || (t.name || '').toLowerCase().includes(filter));
  list.replaceChildren(...(shown.length ? shown.map(torrentRow) : [el('div', { class: 'empty' }, torrents.length ? 'Nothing matches that filter.' : 'No torrents yet. Add one, or let Midgar send some.')]));
}

function drawAdd() {
  const paused = el('input', { type: 'checkbox', id: 'apause' });
  const magnet = el('input', { type: 'text', id: 'amag', placeholder: 'magnet:?xt=… or https://…/file.torrent', style: 'width:100%' });
  const fileIn = el('input', { type: 'file', accept: '.torrent', multiple: true, id: 'afile', class: 'sr' });
  const opts = () => ({ paused: paused.checked });
  async function addFiles(files) {
    for (const f of files) {
      const buf = new Uint8Array(await f.arrayBuffer());
      let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
      try {
        const r = await rpc('torrent-add', { metainfo: btoa(bin), ...opts() });
        toast(r['torrent-duplicate'] ? 'Already in the list' : 'Added ' + f.name);
      } catch (e) { toast(f.name + ': ' + e.message); }
    }
    go('torrents');
  }
  const drop = el('label', { class: 'drop', for: 'afile', ondragover: (e) => { e.preventDefault(); drop.classList.add('over'); }, ondragleave: () => drop.classList.remove('over'), ondrop: (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); } }, 'Drop .torrent files here, or click to pick them');
  fileIn.addEventListener('change', () => addFiles(fileIn.files));
  $('#page').replaceChildren(el('div', { class: 'scroll' },
    el('h1', {}, 'Add'),
    el('div', { class: 'field' }, el('label', { class: 'lbl', for: 'amag' }, 'MAGNET LINK OR URL'), magnet),
    el('div', { class: 'field' }, el('label', { class: 'lbl', for: 'apause' }, 'ADD PAUSED'), el('div', {}, paused)),
    el('div', { style: 'display:flex;gap:8px;margin:10px 0' }, el('button', { class: 'btn primary', onclick: async () => {
      const v = magnet.value.trim(); if (!v) return magnet.focus();
      try { const r = await rpc('torrent-add', { filename: v, ...opts() }); toast(r['torrent-duplicate'] ? 'Already in the list' : 'Added'); go('torrents'); } catch (e) { toast(e.message, true); }
    } }, 'Add link')),
    el('h2', {}, '.TORRENT FILES'), fileIn, drop));
}

let settings = null;
async function drawSettings() {
  settings = await api('settings');
  const s = settings, adapters = (state && state.adapters) || [];
  const v = {};
  const text = (k, attrs = {}) => (v[k] = el('input', { type: 'text', id: 'f-' + k, value: s[k] ?? '', ...attrs }));
  const num = (k, attrs = {}) => (v[k] = el('input', { type: 'number', id: 'f-' + k, value: s[k] ?? 0, style: 'width:140px', ...attrs }));
  const check = (k) => (v[k] = el('input', { type: 'checkbox', id: 'f-' + k, checked: !!s[k] }));
  const field = (k, label, control, help) => el('div', { class: 'field' }, el('label', { class: 'lbl', for: 'f-' + k }, label), control, help ? el('div', { class: 'help' }, help) : null);
  const adapterSel = (v.adapter = el('select', { id: 'f-adapter' }, el('option', { value: '' }, 'Any (not bound)'), ...adapters.map((a) => el('option', { value: a.name, selected: a.name === s.adapter }, a.label + (a.vpn ? '  (VPN)' : '')))));
  const seedSel = (v.seed_action = el('select', { id: 'f-seed_action' }, ...[['pause', 'Pause it'], ['remove', 'Remove it (keep files)'], ['remove-delete', 'Remove it and delete files']].map(([val, t]) => el('option', { value: val, selected: s.seed_action === val }, t))));
  const encSel = (v.encryption = el('select', { id: 'f-encryption' }, ...[[0, 'Allow'], [1, 'Prefer'], [2, 'Require']].map(([val, t]) => el('option', { value: val, selected: s.encryption === val }, t))));
  const pass = el('input', { type: 'password', id: 'f-rpc_password', placeholder: s.rpc_password_set ? '(unchanged)' : '', autocomplete: 'new-password' });

  // The Save button says what happened: "Unsaved changes" once something is
  // edited, then "Saved ✓" with the time for a few seconds after saving.
  let dirty = false;
  const saveBtn = el('button', { class: 'btn primary', onclick: () => save() }, 'Save');
  const savedNote = el('span', { class: 'saved-note', 'aria-live': 'polite' });
  function showSaved() {
    clearTimeout(showSaved.t);
    saveBtn.textContent = 'Saved ✓'; saveBtn.className = 'btn primary saved';
    savedNote.textContent = 'Saved at ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    savedNote.className = 'saved-note';
    showSaved.t = setTimeout(() => { if (!dirty) { saveBtn.textContent = 'Save'; saveBtn.className = 'btn primary'; } }, 3000);
  }
  function markDirty(e) {
    if (e.target.closest('.segs')) return; // theme and Simple/Advanced save by themselves
    if (dirty) return;
    dirty = true;
    clearTimeout(showSaved.t);
    saveBtn.textContent = 'Save'; saveBtn.className = 'btn primary';
    savedNote.textContent = 'Unsaved changes'; savedNote.className = 'saved-note pending';
  }
  async function save() {
    const body = {};
    for (const [k, c] of Object.entries(v)) {
      if (c.type === 'checkbox') body[k] = c.checked;
      else if (c.type === 'number') body[k] = Number(c.value);
      else if (k === 'encryption') body[k] = Number(c.value);
      else body[k] = c.value;
    }
    if (pass.value) body.rpc_password = pass.value;
    body.advanced_mode = advanced;
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    try {
      await api('settings', 'PUT', body);
      pass.value = '';
      dirty = false;
      showSaved();
      toast('Settings saved');
      refresh();
    } catch (e) {
      saveBtn.textContent = 'Save'; saveBtn.className = 'btn primary';
      toast("Didn't save: " + e.message, true);
    } finally { saveBtn.disabled = false; }
  }

  // Simple shows what most people touch; Advanced adds the rest, the tools and the log.
  let advanced = !!s.advanced_mode;
  const adv = (...kids) => el('div', { class: 'adv' }, ...kids);
  const modeBtn = (on, label) => el('button', { class: 'seg', 'aria-pressed': String(advanced === on), onclick: () => setMode(on) }, label);
  const modes = el('div', { class: 'segs', role: 'group', 'aria-label': 'Settings detail' });
  const body = el('div', { class: 'scroll' });
  function setMode(on) {
    advanced = on;
    body.classList.toggle('simple', !on);
    modes.replaceChildren(modeBtn(false, 'Simple'), modeBtn(true, 'Advanced'));
    if (on) loadLog();
    // Remember the choice without making the user press Save.
    if (state) state.advanced = on;
    api('settings', 'PUT', { advanced_mode: on }).catch(() => {});
  }
  const logBox = el('div', { class: 'log logbox' });
  // The theme switches and saves at once.
  const themeSegs = el('div', { class: 'segs', role: 'group', 'aria-label': 'Theme' });
  const drawThemeSegs = () => themeSegs.replaceChildren(...[['ff', 'FFVII menu'], ['green', 'Box of X']].map(([val, label]) =>
    el('button', { class: 'seg', 'aria-pressed': String((state && state.theme) === val), onclick: async () => {
      if (state.theme === val) return;
      try { await api('settings', 'PUT', { theme: val }); state.theme = val; applyTheme(true); drawThemeSegs(); }
      catch (e) { toast("Couldn't switch: " + e.message, true); }
    } }, label)));
  drawThemeSegs();
  const updBox = el('div', { class: 'field' });
  drawSettings.drawUpdates = () => {
    const u = (state && state.update) || {};
    let line;
    if (u.busy) line = u.busy;
    else if (u.version) line = `Lifestream ${u.version} is available (you have ${u.current}).`;
    else if (u.checking) line = 'Checking…';
    else if (u.error) line = u.error;
    else if (u.checkedMinsAgo !== null && u.checkedMinsAgo !== undefined) line = `You have the newest version (${u.current}). Checked ${u.checkedMinsAgo < 1 ? 'just now' : u.checkedMinsAgo + ' min ago'}.`;
    else line = `You have ${u.current || (state && state.version) || ''}. Not checked yet.`;
    const key = line + '|' + !!u.version + '|' + !!u.busy;
    if (updBox.dataset.key === key) return;
    updBox.dataset.key = key;
    const buttons = el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
      el('button', { class: 'btn', disabled: !!(u.busy || u.checking), onclick: () => doAction('update-check', 'Checking for updates…') }, 'Check now'),
      u.version && !u.busy ? (u.canInstall
        ? el('button', { class: 'btn primary', onclick: () => installUpdate(u.version) }, 'Update now')
        : el('a', { class: 'btn', href: u.spk || u.page, target: '_blank', rel: 'noreferrer' }, 'Download package')) : null);
    updBox.replaceChildren(el('span', { class: 'lbl' }, 'VERSION'), el('div', {}, el('div', { class: u.error && !u.version ? 'warn' : '', style: 'margin-bottom:8px' }, line), buttons));
  };
  drawSettings.drawUpdates();
  async function loadLog() {
    try { const { lines } = await api('log'); logBox.replaceChildren(...(lines.length ? lines.map((l) => el('div', { class: l.level === 'error' ? 'bad' : l.level === 'warn' ? 'warn' : '' }, `${l.time}  ${l.text}`)) : [el('div', { class: 'dimc' }, 'Nothing logged yet.')])); logBox.scrollTop = logBox.scrollHeight; }
    catch (e) { toast(e.message, true); }
  }

  body.append(
      el('h2', {}, 'FOLDERS'),
      field('download_dir', 'DOWNLOAD FOLDER', text('download_dir', { style: 'width:100%' }), 'Where downloads are saved. In Docker this is a folder inside a mounted volume, like /downloads/Lifestream.'),
      adv(field('incomplete_enabled', 'KEEP UNFINISHED SEPARATE', check('incomplete_enabled')),
        field('incomplete_dir', 'UNFINISHED FOLDER', text('incomplete_dir', { style: 'width:100%' }))),
      el('h2', {}, 'VPN'),
      field('adapter', 'VPN ADAPTER', adapterSel, 'Torrent traffic only uses this connection. In Docker behind NAS VPN, pick tun0.'),
      field('kill_switch', 'KILL SWITCH', check('kill_switch'), 'If the adapter drops (or none is picked), everything pauses until it is back.'),
      adv(field('listen_port', 'LISTENING PORT', num('listen_port')),
        field('follow_vpn_port', 'USE VPN PORT FORWARDING', check('follow_vpn_port')),
        field('natpmp', 'NAT-PMP', check('natpmp')),
        field('upnp', 'UPNP', check('upnp'))),
      el('h2', {}, 'SPEED (KB/S, 0 = NO LIMIT)'),
      field('dl_limit_kb', 'DOWNLOAD', num('dl_limit_kb')),
      field('ul_limit_kb', 'UPLOAD', num('ul_limit_kb')),
      adv(field('turtle_dl_kb', 'TURTLE DOWNLOAD', num('turtle_dl_kb')),
        field('turtle_ul_kb', 'TURTLE UPLOAD', num('turtle_ul_kb')),
        field('active_downloads', 'ACTIVE DOWNLOADS', num('active_downloads')),
        field('active_seeds', 'ACTIVE SEEDS', num('active_seeds'))),
      el('h2', {}, 'SEEDING'),
      field('ratio_limit', 'STOP AT RATIO', num('ratio_limit', { step: '0.1' }), '0 = no limit'),
      adv(field('seed_hours', 'OR AFTER HOURS', num('seed_hours', { step: '0.5' }), '0 = no limit')),
      field('seed_action', 'THEN', seedSel),
      adv(el('h2', {}, 'PRIVACY'),
        field('encryption', 'ENCRYPTION', encSel),
        field('anonymous_mode', 'ANONYMOUS MODE', check('anonymous_mode')),
        field('dht', 'DHT', check('dht')),
        field('pex', 'PEER EXCHANGE', check('pex'), 'Takes effect after a restart.'),
        field('lsd', 'LOCAL PEER DISCOVERY', check('lsd')),
        field('blocklist_url', 'BLOCKLIST URL', text('blocklist_url', { style: 'width:100%' }))),
      el('h2', {}, 'LOOK'),
      el('div', { class: 'field' }, el('span', { class: 'lbl' }, 'THEME'), el('div', {}, themeSegs)),
      field('reduce_motion', 'CALMER MOTION', check('reduce_motion'), 'Pages switch with no zoom, and the orb on the Box of X home screen holds still.'),
      el('h2', {}, 'UPDATES'),
      updBox,
      (state && state.update && state.update.canInstall) ? field('auto_update', 'UPDATE AUTOMATICALLY', check('auto_update'), 'Checks every 6 hours and installs new versions by itself. Downloads pause for a few seconds while it restarts.') : null,
      el('h2', {}, 'REMOTE CONTROL (MIDGAR, TURKS, MATERIA)'),
      el('p', { class: 'help', style: 'margin:0 0 12px' }, `Always on: this sign-in is also what other apps use to send downloads here. In Midgar, Turks or Materia add a download client of type Transmission: Host ${location.hostname} (or localhost when the app runs on this same machine), Port ${location.port || 9091}, URL base /transmission/, and the username and password below.`),
      field('rpc_username', 'USERNAME', text('rpc_username')),
      el('div', { class: 'field' }, el('label', { class: 'lbl', for: 'f-rpc_password' }, 'NEW PASSWORD'), pass, el('div', { class: 'help' }, 'Leave empty to keep the current password.')),
      adv(el('h2', {}, 'TOOLS'),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
          el('button', { class: 'btn', onclick: () => doAction('leak-check', 'Leak check started. The result shows up here and in the log.') }, 'Leak check'),
          el('button', { class: 'btn', onclick: () => doAction('update-blocklist', 'Updating blocklist…') }, 'Update blocklist'),
          el('button', { class: 'btn', onclick: () => doAction('rss-check', 'Checking feeds…') }, 'Check RSS now')),
        el('div', { class: 'toolbar', style: 'margin-top:18px' }, el('h2', { style: 'margin:0;flex:1' }, 'LOG'), el('button', { class: 'btn', onclick: loadLog }, 'Refresh')),
        logBox),
      el('p', { class: 'dimc' }, `Lifestream ${state ? state.version : ''}${state && state.headless ? ' for Synology' : ''}`));


  $('#page').replaceChildren(
    el('div', { class: 'toolbar' }, el('h1', { style: 'margin:0;flex:1' }, 'Settings'), modes, savedNote, saveBtn),
    body);
  body.addEventListener('input', markDirty);
  body.addEventListener('change', markDirty);
  body.classList.toggle('simple', !advanced);
  modes.replaceChildren(modeBtn(false, 'Simple'), modeBtn(true, 'Advanced'));
  if (advanced) loadLog();
}

// ---- Box of X (green console-dashboard theme)
const MENU = [['torrents', 'Torrents'], ['add', 'Add'], ['settings', 'Settings']];
const isGreen = () => !!(state && state.theme === 'green');
let home = false, cursor = 0, themeShown = null, zooming = false;
const calm = () => !!(state && state.reduceMotion) || matchMedia('(prefers-reduced-motion: reduce)').matches;

/** Match the page to the saved theme. `stay` keeps the current page open (switching from Settings). */
function applyTheme(stay) {
  document.body.classList.toggle('calm', calm());
  const theme = isGreen() ? 'green' : 'ff';
  if (theme === themeShown && !stay) return;
  themeShown = theme;
  document.body.classList.toggle('green', theme === 'green');
  $('meta[name=theme-color]').content = theme === 'green' ? '#0a3608' : '#121e78';
  if (theme !== 'green') { document.body.classList.remove('ghome-on'); home = false; stopHelix(); return; }
  drawGreenTabs();
  if (state) { const [k, t, d] = overall(); drawGreenStatus(k, t, d); }
  // Box of X opens on its home screen.
  if (stay) leaveHome(page); else goHome();
}

function setGreenTitle(text) {
  const t = $('#gtitle'); t.textContent = text;
  let size = innerWidth <= 820 ? 18 : 26; t.style.fontSize = size + 'px';
  while (size > 12 && t.scrollWidth > t.clientWidth) { size--; t.style.fontSize = size + 'px'; }
}

/** Showing a page (called by go). */
function leaveHome(p) {
  home = false;
  document.body.classList.remove('ghome-on');
  stopHelix();
  setGreenTitle((MENU.find((m) => m[0] === p) || [, p])[1]);
  drawGreenTabs();
  drawGrid();
}

function goHome() {
  home = true;
  const i = MENU.findIndex((m) => m[0] === page);
  cursor = i < 0 ? 0 : i;
  document.body.classList.add('ghome-on');
  renderHome();
}

function drawGreenTabs() {
  $('#gtabs').replaceChildren(...MENU.map(([key, label]) => el('button', { class: 'gnav', 'aria-current': key === page && !home ? 'page' : 'false', onclick: () => { if (key !== page) switchPage(key); } }, label)));
}

// Status box: the VPN light, speeds, what's going on, and the UPDATE chip.
function drawGreenStatus(kind, title, detail) {
  if (!isGreen()) return;
  const held = state.killHold || state.userPaused;
  const top = `${title} · Down ${rate(held ? 0 : state.dlRate)} · Up ${rate(held ? 0 : state.ulRate)}`;
  const level = kind === 'good' ? '' : kind;
  for (const id of ['#gstatus', '#ghome-status']) {
    const box = $(id);
    let chip = box.querySelector('.gchip');
    if (!chip) {
      box.replaceChildren(el('span', { class: 'orb' }), el('span', { class: 'lines' }, el('span', { class: 'l1', style: 'display:block' }), el('span', { class: 'l2', style: 'display:block' })), el('a', { class: 'gchip', hidden: true }));
      chip = box.querySelector('.gchip');
    }
    box.querySelector('.orb').className = 'orb ' + level;
    box.querySelector('.l1').textContent = top;
    const l2 = box.querySelector('.l2'); l2.textContent = detail || 'Running'; l2.className = 'l2 ' + level;
    fillUpdateLink(chip, false);
  }
  $('#gmode-label').textContent = state.advanced ? 'ADVANCED' : 'SIMPLE';
}

// Opening a page from home: the orb drifts closer while everything eases into
// a dark veil, then the page fades in out of it. Back plays it reversed.
// Slow and soft on purpose: no bright frames.
const ZOOM_MS = 600, REVEAL_MS = 500;
const veil = () => $('#gveil');
const fade = (from, to, ms) => veil().animate([{ opacity: from }, { opacity: to }], { duration: ms, easing: 'ease-in-out', fill: 'forwards' }).finished;
const orbFrames = (a, b) => [{ transform: `translate(-50%, -50%) scale(${a})` }, { transform: `translate(-50%, -50%) scale(${b})` }];

async function openFromHome(key) {
  if (zooming) return;
  if (calm()) return go(key);
  zooming = true;
  const orb = $('#bigorb');
  orb.animate(orbFrames(1, 1.6), { duration: ZOOM_MS, easing: 'ease-in-out', fill: 'forwards' });
  await fade(0, 0.96, ZOOM_MS);
  orb.getAnimations().forEach((a) => a.cancel());
  go(key);
  await fade(0.96, 0, REVEAL_MS);
  zooming = false;
}

async function zoomHome() {
  if (zooming || home) return;
  if (calm()) return goHome();
  zooming = true;
  await fade(0, 0.96, REVEAL_MS);
  goHome();
  $('#bigorb').animate(orbFrames(1.6, 1), { duration: ZOOM_MS, easing: 'ease-in-out' });
  await fade(0.96, 0, ZOOM_MS);
  zooming = false;
}

/** Page tabs: a short soft fade between pages. */
async function switchPage(key) {
  if (zooming) return;
  if (calm()) return go(key);
  zooming = true;
  await fade(0, 0.7, 200);
  go(key);
  await fade(0.7, 0, 300);
  zooming = false;
}

function markCursor() {
  document.querySelectorAll('.gmenu-item').forEach((x, i) => { x.classList.toggle('lit', i === cursor); x.querySelector('.node').classList.toggle('lit', i === cursor); });
}

// Keys: arrows and Enter on home; Esc goes back home from a page.
document.addEventListener('keydown', (e) => {
  if (!isGreen() || $('#app').hidden && !home) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
  if (typing) return;
  if (home) {
    const n = MENU.length;
    if (e.key === 'ArrowDown') cursor = (cursor + 1) % n;
    else if (e.key === 'ArrowUp') cursor = (cursor + n - 1) % n;
    else if (e.key === 'Enter') { e.preventDefault(); return openFromHome(MENU[cursor][0]); }
    else return;
    e.preventDefault(); markCursor();
  } else if (e.key === 'Escape') { e.preventDefault(); zoomHome(); }
});
// The mouse's side "back" button.
for (const type of ['mousedown', 'mouseup']) {
  window.addEventListener(type, (e) => {
    if (e.button !== 3 || !isGreen()) return;
    e.preventDefault();
    if (type === 'mouseup') zoomHome();
  });
}

function renderHome() {
  const W = innerWidth, H = innerHeight, narrow = W < 700;
  const r = narrow ? Math.max(70, Math.min(W * 0.26, H * 0.16)) : Math.max(90, Math.min(H * 0.24, W * 0.16));
  const ox = narrow ? W / 2 : W * 0.3, oy = narrow ? H * 0.26 : H / 2 - 24;
  const orb = $('#bigorb');
  orb.style.cssText = `left:${ox}px;top:${oy}px;width:${2 * r}px;height:${2 * r}px;--r:${r}px`;
  orb.innerHTML = `<div class="shell"></div><div class="spin"></div><div class="jelly"></div><div class="core"></div>
    <div class="lobe" style="left:4%;top:47%;width:42%;height:30%"></div>
    <div class="lobe" style="left:61%;top:23%;width:32%;height:45%;animation-duration:9s"></div>
    <div class="lobe" style="left:30%;top:70%;width:50%;height:22%;animation-duration:11s"></div>`;
  const canvas = el('canvas', {}); orb.append(canvas);
  const n = MENU.length;
  const rowH = narrow ? 56 : Math.max(44, Math.min(66, (H - 160) / n));
  const nodeR = Math.min(rowH * 0.42, 28);
  const arcR = Math.max(r * 1.5, n * rowH * 0.62);
  const tabW = narrow ? Math.min(W - 120, 320) : Math.max(220, Math.min(460, W - ox - arcR - 140));
  $('#gmenu').replaceChildren(...MENU.map(([key, label], i) => {
    const dy = (i - (n - 1) / 2) * rowH;
    const left = narrow ? (W - tabW - 2 * nodeR - 26) / 2 : ox + Math.sqrt(Math.max(0, arcR * arcR - dy * dy)) - nodeR;
    const top = narrow ? oy + r * 1.35 + i * rowH : oy + dy - rowH * 0.38;
    return el('div', { class: 'gmenu-item', role: 'button', tabindex: '-1', 'aria-label': label, style: `left:${left}px;top:${top}px;height:${rowH * 0.76}px`,
      onmousemove: () => { if (cursor !== i) { cursor = i; markCursor(); } }, onclick: () => openFromHome(key) },
      el('span', { class: 'node', style: `width:${2 * nodeR}px;height:${2 * nodeR}px` }),
      el('span', { class: 'wire' }),
      el('span', { class: 'gtab', style: `width:${tabW}px;font-size:${Math.min(rowH * 0.42, 25)}px` }, label));
  }));
  markCursor();
  $('#gmode').style.left = narrow ? '22px' : Math.min(W * 0.46, 600) + 50 + 'px';
  if (narrow) { $('#gmode').style.bottom = '26px'; }
  drawGrid(ox, oy);
  startHelix(canvas, r);
  if (state) { const [k, t, d] = overall(); drawGreenStatus(k, t, d); }
}

// The orb's emblem: a slowly twisting double helix (the Lifestream) in pale
// light, with motes drifting along it. Drawn about 30 times a second, only
// while the home screen shows; held still with calmer motion on.
let helixTimer = 0;
function stopHelix() { cancelAnimationFrame(helixTimer); helixTimer = 0; }
function startHelix(canvas, r) {
  stopHelix();
  const dpr = devicePixelRatio || 1;
  canvas.width = Math.round(2 * r * dpr); canvas.height = Math.round(2 * r * dpr);
  const g = canvas.getContext('2d');
  let last = 0;
  const frame = (now) => {
    if (!home || !isGreen()) return;
    if (!calm()) helixTimer = requestAnimationFrame(frame);
    if (now - last < 33 && !calm()) return;
    last = now;
    const t = calm() ? 2 : now / 1000;
    g.setTransform(dpr, 0, 0, dpr, r * dpr, r * dpr);
    g.clearRect(-r, -r, 2 * r, 2 * r);
    const h = r * 0.44, amp = r * 0.24, turn = (Math.PI * 2) / (h * 1.3), phase = t * 0.7;
    const at = (y, strand) => { const a = (y + h) * turn + phase + strand * Math.PI; return [amp * Math.sin(a), Math.cos(a)]; };
    const ink = (d, a) => `rgba(255,255,230,${(a * (0.45 + 0.55 * (d + 1) / 2)).toFixed(3)})`;
    g.lineCap = 'round';
    g.strokeStyle = 'rgba(255,255,230,.33)'; g.lineWidth = Math.max(1.5, r * 0.025);
    for (let y = -h + h * 0.08; y < h * 0.96; y += h * 0.16) { g.beginPath(); g.moveTo(at(y, 0)[0], y); g.lineTo(at(y, 1)[0], y); g.stroke(); }
    const step = h / 28;
    for (const strand of [0, 1]) for (let y = -h; y < h; y += step) {
      const [x0, d0] = at(y, strand), [x1, d1] = at(y + step, strand), d = (d0 + d1) / 2;
      g.strokeStyle = ink(d, 0.95); g.lineWidth = Math.max(1.5, r * (0.03 + 0.028 * (d + 1) / 2));
      g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y + step); g.stroke();
    }
    for (let i = 0; i < 5; i++) {
      const f = ((t * 0.12 + i * 0.2) % 1) * 2 - 1, y = f * h, [x, d] = at(y, i % 2);
      g.fillStyle = ink(d, 1); g.beginPath(); g.arc(x, y, Math.max(1.5, r * 0.03) * (0.8 + 0.4 * (d + 1) / 2), 0, Math.PI * 2); g.fill();
    }
  };
  helixTimer = requestAnimationFrame(frame);
}

/** Background: dark green fade with faint rings and spokes around a hub. */
function drawGrid(hx, hy) {
  if (!isGreen()) return;
  const W = innerWidth, H = innerHeight;
  if (hx === undefined) { hx = W * 0.2; hy = H * 0.15; }
  const far = Math.max(W, H) * 1.1;
  let rings = '', spokes = '';
  for (let k = 1; k <= 6; k++) { const rx = 230 * k * 0.85 + 60; rings += `<ellipse cx="${hx}" cy="${hy}" rx="${rx}" ry="${rx * 0.92}"/>`; }
  for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2 + 0.2; spokes += `<line x1="${hx}" y1="${hy}" x2="${hx + Math.cos(a) * far}" y2="${hy + Math.sin(a) * far}"/>`; }
  const g = $('#gbg');
  g.setAttribute('viewBox', `0 0 ${W} ${H}`);
  g.innerHTML = `<defs><radialGradient id="gfade" gradientUnits="userSpaceOnUse" cx="${hx}" cy="${hy}" r="${far}"><stop offset="0" stop-color="#165c10"/><stop offset=".25" stop-color="#0a3608"/><stop offset=".55" stop-color="#041c04"/><stop offset="1" stop-color="#010a01"/></radialGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#gfade)"/><g fill="none" stroke="rgba(120,220,60,0.13)" stroke-width="1.4">${rings}${spokes}</g>`;
}
addEventListener('resize', () => { if (!isGreen()) return; if (home) renderHome(); else { drawGrid(); setGreenTitle($('#gtitle').textContent); } });

$('#gback').addEventListener('click', () => zoomHome());
$('#genter').addEventListener('click', () => openFromHome(MENU[cursor][0]));
$('#gstatus').addEventListener('click', () => { if (page !== 'settings') switchPage('settings'); });
$('#ghome-status').addEventListener('click', () => openFromHome('settings'));
$('#gmode').addEventListener('click', async () => {
  try { await api('settings', 'PUT', { advanced_mode: !state.advanced }); state.advanced = !state.advanced; $('#gmode-label').textContent = state.advanced ? 'ADVANCED' : 'SIMPLE'; toast(state.advanced ? 'Advanced: every setting, the tools and the log.' : 'Simple: just the settings most people need.'); }
  catch (e) { toast(e.message, true); }
});

function go(p, keepHome) {
  page = p; history.replaceState(null, '', '#' + p);
  if (isGreen() && !(keepHome && home)) leaveHome(p);
  document.querySelectorAll('.mi').forEach((b) => b.setAttribute('aria-current', b.dataset.page === p ? 'page' : 'false'));
  ({ torrents: drawTorrents, add: drawAdd, settings: drawSettings })[p]();
}

document.querySelectorAll('.mi').forEach((b) => b.addEventListener('click', () => go(b.dataset.page)));
async function togglePauseAll() { await doAction(state && state.userPaused ? 'resume-all' : 'pause-all'); refresh(); }
$('#pause-all').addEventListener('click', togglePauseAll);
$('#setup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { await api('setup', 'POST', { user: $('#su').value, pass: $('#sp').value }); location.reload(); }
  catch (err) { $('#setup-error').textContent = err.message; }
});

refresh().then(() => { if (state && !state.setup) go(['torrents', 'add', 'settings'].includes(page) ? page : 'torrents', true); });
setInterval(refresh, 2000);
</script>
