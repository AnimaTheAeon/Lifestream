name: Build Windows and Synology

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  LIFESTREAM_VCPKG_TRIPLET: x64-windows-static-md

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      exists: ${{ steps.ver.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      # libtorrent (the engine qBittorrent and Deluge use) comes from vcpkg.
      - name: Locate vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD | Out-File -Encoding ascii vcpkg-commit.txt

      - name: Restore libtorrent build
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libtorrent-${{ env.LIFESTREAM_VCPKG_TRIPLET }}-${{ hashFiles('vcpkg-commit.txt') }}

      - name: Install libtorrent
        shell: pwsh
        run: vcpkg install "libtorrent:$env:LIFESTREAM_VCPKG_TRIPLET"

      # Saved right away, so a failure later in the job doesn't throw away a 25-minute build.
      - name: Save libtorrent build
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libtorrent-${{ env.LIFESTREAM_VCPKG_TRIPLET }}-${{ hashFiles('vcpkg-commit.txt') }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Build installer
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\lifestream.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem target\installer

      - uses: actions/upload-artifact@v4
        with:
          name: lifestream-windows-x64
          path: |
            target/release/lifestream.exe
            target/installer/*.exe

      - name: Attach exe to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Lifestream ${{ github.ref_name }}
          files: |
            target/release/lifestream.exe
            target/installer/*.exe
          make_latest: true
          overwrite_files: true

  # Headless Lifestream for Synology DSM 7 (x86_64, e.g. DS923+), controlled
  # from its web page. Built on Debian 11 (glibc 2.31), older than any DSM 7.2
  # system library, so it runs there; libtorrent, OpenSSL and the C++ runtime
  # are bundled next to the binary.
  synology:
    runs-on: ubuntu-latest
    container: debian:bullseye
    steps:
      - name: Build tools
        run: |
          apt-get update -q
          apt-get install -y -q build-essential cmake ninja-build libboost-dev libssl-dev pkg-config curl wget git ca-certificates file
      - uses: actions/checkout@v4
      # Debian 11's libtorrent is too old, so build 2.0.10 once and cache it.
      - name: Restore libtorrent
        id: lt-cache
        uses: actions/cache@v4
        with:
          path: /opt/lt
          key: libtorrent-2.0.10-debian-11
      - name: Build libtorrent
        if: steps.lt-cache.outputs.cache-hit != 'true'
        run: |
          wget -q -O lt.tar.gz https://github.com/arvidn/libtorrent/releases/download/v2.0.10/libtorrent-rasterbar-2.0.10.tar.gz
          tar xzf lt.tar.gz
          cmake -S libtorrent-rasterbar-2.0.10 -B lt-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/lt -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_CXX_STANDARD=17 \
            -Dpython-bindings=OFF -Dbuild_tests=OFF -Dbuild_examples=OFF -Dbuild_tools=OFF
          cmake --build lt-build
          cmake --install lt-build
      - name: Use libtorrent
        run: |
          echo "PKG_CONFIG_PATH=/opt/lt/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/lt/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: headless
      - name: Test
        run: cargo test --release --no-default-features
      - name: Build
        env:
          # DT_RPATH (not RUNPATH) so bundled libraries also find each other.
          RUSTFLAGS: "-C link-arg=-Wl,--disable-new-dtags,-rpath,$ORIGIN/lib"
        run: cargo build --release --no-default-features
      - name: Package
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          rm -rf stage dist && mkdir -p stage/lib
          cp target/release/lifestream stage/
          # Everything it links except the C library itself, which DSM provides.
          ldd stage/lifestream | awk '/=> \//{print $3}' \
            | grep -vE '/(libc|libm|libpthread|libdl|librt|ld-linux[^/]*)\.so' \
            | xargs -r -I{} cp -L {} stage/lib/
          ls -la stage/lib
          # Newest glibc symbol it needs (must be older than DSM's).
          for f in stage/lifestream stage/lib/*; do objdump -T "$f" | grep -o 'GLIBC_[0-9.]*'; done | sort -uV | tail -1
          sh synology/build-spk.sh stage "$v" dist
      - uses: actions/upload-artifact@v4
        with:
          name: lifestream-synology-x86_64
          path: dist/*.spk

  # A push to main with a new version number publishes a release.
  release:
    needs: [build, synology]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release for new version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lifestream v${{ needs.build.outputs.version }}
          files: |
            dist/release/lifestream.exe
            dist/installer/*.exe
            dist/*.spk
          make_latest: true
          generate_release_notes: true
