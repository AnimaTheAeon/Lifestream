name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  LIFESTREAM_VCPKG_TRIPLET: x64-windows-static-md

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # libtorrent (the engine qBittorrent and Deluge use) comes from vcpkg.
      - name: Locate vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD | Out-File -Encoding ascii vcpkg-commit.txt

      - name: Cache libtorrent build
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libtorrent-${{ env.LIFESTREAM_VCPKG_TRIPLET }}-${{ hashFiles('vcpkg-commit.txt') }}

      - name: Install libtorrent
        shell: pwsh
        run: vcpkg install "libtorrent:$env:LIFESTREAM_VCPKG_TRIPLET"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: lifestream-windows-x64
          path: target/release/lifestream.exe

      # A push to main with a new version number publishes a release.
      - name: Publish release for new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lifestream v${{ steps.ver.outputs.version }}
          files: target/release/lifestream.exe
          make_latest: true
          generate_release_notes: true

      - name: Attach exe to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Lifestream ${{ github.ref_name }}
          files: target/release/lifestream.exe
          make_latest: true
          overwrite_files: true
